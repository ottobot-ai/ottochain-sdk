syntax = "proto3";

package ottochain.apps.markets.v1;

import "ottochain/v1/common.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// Type of market mechanism
enum MarketType {
  MARKET_TYPE_UNSPECIFIED = 0;
  MARKET_TYPE_PREDICTION = 1;   // Prediction market for future outcomes
  MARKET_TYPE_AUCTION = 2;      // Auction with bidding mechanics
  MARKET_TYPE_CROWDFUND = 3;    // Crowdfunding with funding goal
  MARKET_TYPE_GROUP_BUY = 4;    // Group purchasing coordination
}

// Market lifecycle states
enum MarketState {
  MARKET_STATE_UNSPECIFIED = 0;
  MARKET_STATE_PROPOSED = 1;    // Market created, awaiting activation
  MARKET_STATE_OPEN = 2;        // Accepting commitments
  MARKET_STATE_CLOSED = 3;      // No longer accepting commitments
  MARKET_STATE_RESOLVING = 4;   // Oracles submitting resolutions
  MARKET_STATE_SETTLED = 5;     // Final outcome determined (terminal)
  MARKET_STATE_REFUNDED = 6;    // Commitments returned (terminal)
  MARKET_STATE_CANCELLED = 7;   // Market cancelled by creator (terminal)
}

// Agent commitment to a market position
message Commitment {
  ottochain.v1.Address agent = 1;         // Committing agent's address
  int64 amount = 2;                        // Token amount committed
  google.protobuf.Struct data = 3;         // Position data (outcome choice, bid, etc.)
  google.protobuf.Timestamp timestamp = 4; // When commitment was made
}

// Oracle resolution submission
message Resolution {
  ottochain.v1.Address oracle = 1;         // Oracle's address
  string outcome = 2;                       // Resolved outcome identifier
  string proof = 3;                         // Evidence/proof of outcome
  google.protobuf.Timestamp timestamp = 4; // When resolution was submitted
}

// Universal market container
message Market {
  string id = 1;                                    // Unique market identifier
  MarketType market_type = 2;                       // Type of market mechanism
  ottochain.v1.Address creator = 3;                 // Market creator's address
  string title = 4;                                 // Human-readable market title
  google.protobuf.Struct terms = 5;                 // Market-specific terms and rules
  google.protobuf.Timestamp deadline = 6;           // When market closes for commitments
  int64 threshold = 7;                              // Minimum commitment threshold
  repeated Commitment commitments = 8;              // All agent commitments
  repeated ottochain.v1.Address oracles = 9;        // Designated oracle addresses
  int32 quorum = 10;                                // Required oracle agreement count
  repeated Resolution resolutions = 11;             // Oracle resolution submissions
  MarketState status = 12;                          // Current market state
  google.protobuf.Timestamp created_at = 13;        // Market creation timestamp
  google.protobuf.Timestamp updated_at = 14;        // Last state update timestamp
}

// Create a new market
message CreateMarketRequest {
  MarketType market_type = 1;
  ottochain.v1.Address creator = 2;
  string title = 3;
  google.protobuf.Struct terms = 4;
  google.protobuf.Timestamp deadline = 5;
  int64 threshold = 6;
  repeated ottochain.v1.Address oracles = 7;
  int32 quorum = 8;
}

// Commit to a market position
message CommitToMarketRequest {
  string market_id = 1;
  ottochain.v1.Address agent = 2;
  int64 amount = 3;
  google.protobuf.Struct position_data = 4;
}

// Submit oracle resolution
message SubmitResolutionRequest {
  string market_id = 1;
  ottochain.v1.Address oracle = 2;
  string outcome = 3;
  string proof = 4;
}

// Cancel a market (creator only, before CLOSED)
message CancelMarketRequest {
  string market_id = 1;
  ottochain.v1.Address creator = 2;
  string reason = 3;
}

// Market state machine definition
message MarketDefinition {
  // Valid transitions:
  //   PROPOSED -> OPEN (activate)
  //   PROPOSED -> CANCELLED (cancel)
  //   OPEN -> CLOSED (close_commitments / deadline reached)
  //   OPEN -> CANCELLED (cancel, if no commitments)
  //   CLOSED -> RESOLVING (begin_resolution)
  //   RESOLVING -> SETTLED (quorum_reached)
  //   RESOLVING -> REFUNDED (resolution_failed / timeout)
  //   CLOSED -> REFUNDED (threshold_not_met)

  int32 min_oracles = 1;                     // Minimum oracle count required
  int32 resolution_timeout_epochs = 2;       // Epochs before resolution timeout
  bool allow_partial_refund = 3;             // Allow refund if threshold not met
}
