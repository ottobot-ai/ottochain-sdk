syntax = "proto3";

package ottochain.v1;

import "ottochain/v1/fiber.proto";
import "google/protobuf/struct.proto";

// State machine fiber record - on-chain representation
message StateMachineFiberRecord {
  string fiber_id = 1;
  int64 creation_ordinal = 2;  // Snapshot ordinal
  int64 previous_update_ordinal = 3;  // Snapshot ordinal
  int64 latest_update_ordinal = 4;  // Snapshot ordinal
  StateMachineDefinition definition = 5;
  string current_state = 6;  // State ID
  google.protobuf.Value state_data = 7;
  string state_data_hash = 8;  // Hash value
  int64 sequence_number = 9;  // Fiber ordinal
  repeated string owners = 10;  // DAG addresses
  FiberStatus status = 11;
  optional EventReceipt last_receipt = 12;
  optional string parent_fiber_id = 13;
  repeated string child_fiber_ids = 14;
}

// Script fiber record - on-chain representation
message ScriptFiberRecord {
  string fiber_id = 1;
  int64 creation_ordinal = 2;  // Snapshot ordinal
  int64 latest_update_ordinal = 3;  // Snapshot ordinal
  google.protobuf.Value script_program = 4;
  optional google.protobuf.Value state_data = 5;
  optional string state_data_hash = 6;  // Hash value
  AccessControlPolicy access_control = 7;
  int64 sequence_number = 8;  // Fiber ordinal
  repeated string owners = 9;  // DAG addresses
  FiberStatus status = 10;
  optional ScriptInvocation last_invocation = 11;
}

// Fiber commit - lightweight proof in on-chain state
message FiberCommit {
  string record_hash = 1;  // Hash value
  optional string state_data_hash = 2;  // Hash value
  int64 sequence_number = 3;  // Fiber ordinal
}

// On-chain state
message OnChainState {
  map<string, FiberCommit> fiber_commits = 1;
  map<string, FiberLogEntryList> latest_logs = 2;
}

// Helper for map of log entries
message FiberLogEntryList {
  repeated FiberLogEntry entries = 1;
}

// Delegation credential - on-chain state tracking for a delegated signing relationship.
// Uses ordinal-based timing (snapshot ordinals) not wall-clock timestamps, matching the
// metagraph's FiberOrdinal / SnapshotOrdinal conventions. BigInt amounts are string-encoded
// to avoid IEEE-754 precision loss in JavaScript.
message DelegationCredential {
  // Address of the user granting the delegation (DAG address)
  string delegator_address = 1;

  // Address of the agent/relayer receiving the delegation (DAG address)
  string relayer_address = 2;

  // Total spend already used under this delegation (BigInt as string, e.g. "1000000000")
  string spend_used = 3;

  // DAG staked as collateral by the relayer (BigInt as string)
  string stake_bonded = 4;

  // Maximum spend allowed under this delegation (BigInt as string)
  string spend_limit = 5;

  // JSON-encoded scope definition: allowed operations, contracts, gas limits etc.
  string scope = 6;

  // Optional session key identifier used for signing delegated transactions
  optional string session_key = 7;

  // Snapshot ordinal when this delegation was created
  int64 created_at = 8;

  // Snapshot ordinal when this delegation expires
  int64 expires_at = 9;

  // Whether this delegation has been revoked by the delegator
  bool is_revoked = 10;

  // Snapshot ordinal when revoked (set when is_revoked becomes true)
  optional int64 revoked_at = 11;
}

// Calculated state - queryable via ML0 endpoints
message CalculatedState {
  map<string, StateMachineFiberRecord> state_machines = 1;
  map<string, ScriptFiberRecord> scripts = 2;
  // Active delegation credentials keyed by delegation ID (UUID string)
  map<string, DelegationCredential> delegations = 3;
}
