syntax = "proto3";

package ottochain.v1;

import "ottochain/v1/common.proto";
import "google/protobuf/struct.proto";

// Fiber lifecycle status
enum FiberStatus {
  FIBER_STATUS_UNSPECIFIED = 0;
  FIBER_STATUS_ACTIVE = 1;
  FIBER_STATUS_ARCHIVED = 2;
  FIBER_STATUS_FAILED = 3;
}

// Access control policy for scripts
message AccessControlPolicy {
  oneof policy {
    PublicAccess public = 1;
    WhitelistAccess whitelist = 2;
    FiberOwnedAccess fiber_owned = 3;
  }
}

message PublicAccess {}

message WhitelistAccess {
  repeated string addresses = 1;  // DAG addresses
}

message FiberOwnedAccess {
  string fiber_id = 1;
}

// State machine definition
message StateMachineDefinition {
  google.protobuf.Struct states = 1;
  string initial_state = 2;  // State ID
  repeated google.protobuf.Struct transitions = 3;
  optional google.protobuf.Struct metadata = 4;
}

// Emitted event from state machine transition
message EmittedEvent {
  string name = 1;
  google.protobuf.Value data = 2;
  optional string destination = 3;
  // Engine-stamped at extraction (EffectExtractor), never user-supplied — make every
  // emitted event attributable to the fiber that produced it (engine-default-fixes Fix 1).
  string emitter_fiber_id = 4;  // The fiber whose transition ran `_emit` (the EMITTER, distinct from EventReceipt.source_fiber_id).
  int32 emission_index = 5;     // Sparse position within the raw `_emit` array at authoring time.
}

// Event receipt - log entry for state machine transition
message EventReceipt {
  string fiber_id = 1;
  int64 sequence_number = 2;  // Fiber ordinal
  string event_name = 3;
  int64 ordinal = 4;  // Snapshot ordinal
  string from_state = 5;  // State ID
  string to_state = 6;  // State ID
  bool success = 7;
  int64 gas_used = 8;
  int32 triggers_fired = 9;
  optional string error_message = 10;
  optional string source_fiber_id = 11;
  repeated EmittedEvent emitted_events = 12;
}

// Script invocation - log entry for script oracle call
message ScriptInvocation {
  string fiber_id = 1;
  string method = 2;
  google.protobuf.Value args = 3;
  google.protobuf.Value result = 4;
  int64 gas_used = 5;
  int64 invoked_at = 6;  // Snapshot ordinal
  string invoked_by = 7;  // DAG address
}

// Creation receipt - birth record for a fiber, emitted once at creation (#26/#30)
message CreationReceipt {
  string fiber_id = 1;
  int64 ordinal = 2;  // Snapshot ordinal
  string initial_state = 3;  // State ID
  repeated string owners = 4;  // DAG addresses
  optional SchemaBinding schema_binding = 5;
  optional string parent_fiber_id = 6;
}

// Upgrade receipt - emitted when a fiber is upgraded to a different registered version (#27)
message UpgradeReceipt {
  string fiber_id = 1;
  int64 ordinal = 2;  // Snapshot ordinal
  optional SchemaBinding from_binding = 3;
  SchemaBinding to_binding = 4;
  int64 gas_used = 5;
  bool migrated = 6;
}

// Fiber log entry - union of event receipt, script invocation, or lifecycle receipt
message FiberLogEntry {
  oneof entry {
    EventReceipt event_receipt = 1;
    ScriptInvocation script_invocation = 2;
    CreationReceipt creation_receipt = 3;
    UpgradeReceipt upgrade_receipt = 4;
  }
}
