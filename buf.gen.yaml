version: v2
managed:
  enabled: true
plugins:
  # Generate TypeScript using ts-proto (plain interfaces)
  - local: ./node_modules/.bin/protoc-gen-ts_proto
    out: src/generated
    opt:
      - esModuleInterop=true
      - importSuffix=.js
      - outputServices=false
      - useOptionals=messages
      - oneof=unions
      - snakeToCamel=true
      - enumsAsLiterals=false
      - outputJsonMethods=true
      - stringEnums=true
