name: Publish

on:
  # Triggered by release-please when tag is created
  push:
    tags: ['v*']
  # Manual trigger still available
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.2.0) - must match existing tag'
        required: true
        type: string

jobs:
  publish:
    name: Build & Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # OIDC trusted publishing to npmjs

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            # Extract from tag
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          # IMPORTANT: do NOT set registry-url/scope here. Passing registry-url makes
          # actions/setup-node write a project .npmrc with `_authToken=${NODE_AUTH_TOKEN}`
          # and default NODE_AUTH_TOKEN to the literal placeholder `XXXXX-XXXXX-XXXXX-XXXXX`.
          # npm/pnpm then attempt TOKEN auth with that bogus value (404) and never fall back
          # to OIDC trusted publishing — any configured token suppresses the OIDC exchange.
          # With no .npmrc token, pnpm publishes to the default npmjs registry via OIDC.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Run tests
        run: pnpm test

      - name: Upgrade npm for OIDC trusted publishing
        # The OIDC -> registry token exchange (trusted publishing) is an npm CLI feature
        # added in 11.5.1. Node 20 ships npm 10.x, and `pnpm publish` does NOT perform the
        # exchange at all (it only signs provenance, then errors ENEEDAUTH). So publish with
        # a recent npm CLI below.
        run: npm install -g npm@latest

      - name: Publish to npmjs.com
        # OIDC trusted publishing: no NODE_AUTH_TOKEN / no .npmrc token. The job's
        # id-token: write permission plus the npm-side trusted publisher (repo + this workflow
        # filename) mint a short-lived publish token; --provenance attaches the attestation.
        # --ignore-scripts skips the `prepare` rebuild (dist already built above).
        run: npm publish --access public --provenance --ignore-scripts

      - name: Setup for GitHub Packages
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ottobot-ai'

      - name: Publish to GitHub Packages
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true  # Don't fail if already published


      - name: Bump SDK in consumer repos
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "⚠️ DEPLOY_REPO_TOKEN not set, skipping consumer notifications"
            exit 0
          fi
          VERSION="${{ steps.version.outputs.version }}"
          for REPO in ottochain-services ottochain-explorer; do
            gh api repos/ottobot-ai/$REPO/dispatches \
              -f event_type=sdk-bump \
              -f "client_payload[version]=$VERSION"
            echo "✅ Notified $REPO to bump @ottochain/sdk to v$VERSION"
          done

      - name: Summary
        run: |
          echo "## 📦 Publish Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: v${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **npmjs.com**: \`@ottochain/sdk@${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Packages**: \`@ottochain/sdk@${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
